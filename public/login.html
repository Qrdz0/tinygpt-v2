<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · tinygpt v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0a;
    --card: #131313;
    --surface: #1a1a1a;
    --border: #2a2a2a;
    --border-strong: #3a3a3a;
    --text: #e5e5e5;
    --muted: #8a8a8a;
    --accent: #e11d48;
    --accent-hover: #f43f5e;
    --red: #f87171;
    --green: #4ade80;
    --hover: #1c1c1c;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    background-image: radial-gradient(ellipse 600px 400px at 50% 42%, rgba(225,29,72,0.07), transparent 70%);
    color: var(--text);
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    display: grid; place-items: center; padding: 20px;
  }
  .card {
    width: 100%; max-width: 380px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 34px 30px 28px;
    box-shadow:
      0 0 0 1px rgba(225,29,72,0.06),
      0 0 60px rgba(225,29,72,0.10),
      0 24px 70px rgba(0,0,0,0.6);
  }
  .logo-row { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .logo {
    width: 40px; height: 40px; border-radius: 11px;
    background: linear-gradient(135deg, #e11d48, #7f1d1d);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; color: #fff;
    box-shadow: 0 6px 24px rgba(225,29,72,0.4);
  }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.2px; }
  h1 span { color: var(--accent-hover); }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
  .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab {
    flex: 1; background: none; border: none; color: var(--muted);
    font-size: 14px; font-weight: 600; font-family: inherit;
    padding: 10px 0; cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  input[type="text"], input[type="password"] {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); border-radius: 10px; padding: 11px 13px;
    font-size: 14px; font-family: inherit; outline: none; margin-bottom: 14px;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus, input[type="password"]:focus { border-color: var(--accent); }
  button.submit {
    width: 100%; background: var(--accent); border: none;
    color: #fff; font-size: 14px; font-weight: 600; font-family: inherit;
    padding: 12px; border-radius: 10px; cursor: pointer;
    margin-top: 4px; transition: background 0.15s;
    box-shadow: 0 4px 18px rgba(225,29,72,0.35);
  }
  button.submit:hover { background: var(--accent-hover); }
  button.submit:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }
  #err {
    display: none; background: rgba(248,113,113,0.08);
    border: 1px solid rgba(248,113,113,0.35); color: var(--red);
    font-size: 13px; padding: 9px 12px; border-radius: 9px; margin-bottom: 14px;
  }
  #ok {
    display: none; background: rgba(74,222,128,0.08);
    border: 1px solid rgba(74,222,128,0.35); color: var(--green);
    font-size: 13px; padding: 9px 12px; border-radius: 9px; margin-bottom: 14px;
  }
  .forgot-row { text-align: right; margin: -8px 0 14px; }
  .forgot-row a { color: var(--accent-hover); font-size: 12px; text-decoration: none; }
  .forgot-row a:hover { text-decoration: underline; }
  .agree {
    display: flex; gap: 9px; align-items: flex-start;
    font-size: 12.5px; color: var(--muted); line-height: 1.5;
    margin: 2px 0 14px; cursor: pointer;
  }
  .agree input { width: auto; margin: 2px 0 0; accent-color: var(--accent); flex-shrink: 0; }
  .agree a { color: var(--accent-hover); text-decoration: none; }
  .agree a:hover { text-decoration: underline; }
  .foot { text-align: center; font-size: 11px; color: #5a5a5a; margin-top: 18px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-row">
      <div class="logo">tG</div>
      <h1>tinygpt <span>v2</span></h1>
    </div>
    <p class="sub">Local AI chat · your data stays on this machine</p>

    <div class="tabs">
      <button class="tab active" id="tab-login">Login</button>
      <button class="tab" id="tab-register">Register</button>
    </div>

    <div id="err"></div>
    <div id="ok"></div>

    <form id="form">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required maxlength="32">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div class="forgot-row" id="forgot-row">
        <a href="/forgot">Forgot password?</a>
      </div>
      <div id="pw2-wrap" class="hidden">
        <label for="password2">Confirm password</label>
        <input id="password2" name="password2" type="password" autocomplete="new-password">
      </div>
      <label class="agree hidden" id="agree-wrap" for="agree">
        <input type="checkbox" id="agree">
        <span>I agree to the <a href="/terms" target="_blank" rel="noopener">Terms of Service</a> and <a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a></span>
      </label>
      <button class="submit" id="submit" type="submit">Log in</button>
    </form>

    <p class="foot">tinygpt v2 · bcrypt-hashed · sessions via express-session</p>
  </div>

<script>
const tabLogin = document.getElementById('tab-login');
const tabRegister = document.getElementById('tab-register');
const pw2Wrap = document.getElementById('pw2-wrap');
const pw2 = document.getElementById('password2');
const pw = document.getElementById('password');
const err = document.getElementById('err');
const ok = document.getElementById('ok');
const submit = document.getElementById('submit');
const form = document.getElementById('form');
const agreeWrap = document.getElementById('agree-wrap');
const agree = document.getElementById('agree');
const forgotRow = document.getElementById('forgot-row');
let mode = 'login';

pw.setAttribute('autocomplete', 'current-password');

function setMode(m) {
  mode = m;
  tabLogin.classList.toggle('active', m === 'login');
  tabRegister.classList.toggle('active', m === 'register');
  pw2Wrap.classList.toggle('hidden', m !== 'register');
  agreeWrap.classList.toggle('hidden', m !== 'register');
  forgotRow.classList.toggle('hidden', m === 'register');
  submit.textContent = m === 'login' ? 'Log in' : 'Create account';
  pw.setAttribute('autocomplete', m === 'login' ? 'current-password' : 'new-password');
  err.style.display = 'none';
  ok.style.display = 'none';
}
tabLogin.onclick = () => setMode('login');
tabRegister.onclick = () => setMode('register');

fetch('/api/me').then(r => { if (r.ok) location = '/'; }).catch(() => {});

// show "password updated" notice when arriving from the reset page
if (new URLSearchParams(location.search).get('reset') === '1') {
  ok.textContent = 'Password updated — log in with your new password.';
  ok.style.display = 'block';
}

form.onsubmit = async e => {
  e.preventDefault();
  err.style.display = 'none';
  ok.style.display = 'none';
  const username = document.getElementById('username').value.trim();
  const password = pw.value;
  if (mode === 'register' && password !== pw2.value) {
    err.textContent = 'Passwords do not match';
    err.style.display = 'block';
    return;
  }
  if (mode === 'register' && !agree.checked) {
    err.textContent = 'You must agree to the Terms of Service and Privacy Policy';
    err.style.display = 'block';
    return;
  }
  submit.disabled = true;
  try {
    const res = await fetch('/api/' + mode, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, agree: agree.checked })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    location = '/';
  } catch (ex) {
    err.textContent = ex.message;
    err.style.display = 'block';
    submit.disabled = false;
  }
};
</script>
</body>
</html>
